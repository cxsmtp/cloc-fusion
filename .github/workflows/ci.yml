name: CI
# Once per change: pull requests, and pushes to main. A push to a pull request's branch
# would otherwise run everything twice and queue for scarce macOS runners.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: node --test test/fusion.test.js test/loc.test.js test/providers.test.js test/scan.test.js test/apiengine.test.js test/security.test.js test/version.test.js test/ui.test.js test/standalone.test.js test/developers.test.js
      - run: node bin/cloc-fusion.js --help
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Benchmark (1,000 repos per scenario; the full 10,000 run is in docs/BENCHMARKS.md)
        run: node bench/bench.js --repos 1000 | tee bench.txt
      - run: tail -8 bench.txt >> "$GITHUB_STEP_SUMMARY"
