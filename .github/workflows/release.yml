name: Standalone executables
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-binary.mjs
      - name: Smoke test
        shell: bash
        run: ./dist/cloc-fusion-*-*${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: cloc-fusion-${{ runner.os }}-${{ runner.arch }}
          path: dist/cloc-fusion-*-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag, version and changelog agree; notes from CHANGELOG.md
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum cloc-fusion-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: cloc-fusion ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
