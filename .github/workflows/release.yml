name: Standalone executables
# Every push builds the executables for all platforms. A release is published when:
#   - a v* tag is pushed, or
#   - the default branch carries a version (src/version.js) that has no v<version> tag yet
#     (CI then creates the tag), or
#   - the workflow is run by hand.
# Either way the tag must match src/version.js, package.json and CHANGELOG.md
# (scripts/release-check.mjs), and that version's CHANGELOG entry becomes the release notes.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Version, and whether to release it
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(node -e "import('./src/version.js').then(m => console.log(m.VERSION))")
          TAG="v$VERSION"
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then RELEASE=true; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "cloc-fusion $VERSION · release: $RELEASE" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-binary.mjs
      - name: Smoke test
        shell: bash
        run: |
          BIN=$(ls dist/cloc-fusion-*-* | head -1)
          test "$("$BIN" --version)" = "${{ needs.version.outputs.version }}"
          "$BIN" changelog | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: cloc-fusion-${{ runner.os }}-${{ runner.arch }}
          path: dist/cloc-fusion-*-*
          if-no-files-found: error
  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag, version and changelog agree; notes from CHANGELOG.md
        run: node scripts/release-check.mjs "${{ needs.version.outputs.tag }}" > RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The standalone page (cloc-fusion.html), rebuilt from this commit
        run: node scripts/build-standalone.mjs && cp cloc-fusion.html dist/
      - name: Checksums
        run: cd dist && sha256sum cloc-fusion-* cloc-fusion.html > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: cloc-fusion ${{ needs.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*
